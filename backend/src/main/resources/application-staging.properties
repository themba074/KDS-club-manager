spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

app.auth.jwt-secret=${JWT_SECRET}
app.auth.refresh-cookie-secure=true
app.auth.allowed-origins=${FRONTEND_ORIGINS}
app.auth.frontend-url=${FRONTEND_URL}
app.auth.development-reset-delivery=false
app.members.development-invitation-delivery=false

app.storage.provider=supabase
app.storage.supabase.url=${SUPABASE_URL}
app.storage.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET}

app.notifications.email-provider=smtp
app.notifications.from-address=${NOTIFICATION_FROM_ADDRESS}
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=true
