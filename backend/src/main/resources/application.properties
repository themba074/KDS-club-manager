spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kds_club_manager}
spring.datasource.username=${DB_USERNAME:kds}
spring.datasource.password=${DB_PASSWORD:kds_dev_password}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

app.auth.jwt-secret=${JWT_SECRET}
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=30d
app.auth.password-reset-token-ttl=30m
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.auth.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5175,http://127.0.0.1:5175}
app.auth.frontend-url=${FRONTEND_URL:http://localhost:5175}
app.auth.development-reset-delivery=${DEVELOPMENT_RESET_DELIVERY:false}
app.members.invitation-token-ttl=7d
app.members.development-invitation-delivery=${DEVELOPMENT_INVITATION_DELIVERY:false}
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1100KB
app.storage.local-root=${KDS_STORAGE_ROOT:${java.io.tmpdir}/kds-club-manager-storage}
