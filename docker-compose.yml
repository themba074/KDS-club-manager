services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kds_club_manager}
      POSTGRES_USER: ${POSTGRES_USER:-kds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kds_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kds_club_manager}
      DB_USERNAME: ${POSTGRES_USER:-kds}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kds_dev_password}
      JWT_SECRET: ${JWT_SECRET:-kds-local-development-signing-key-change-before-production-2026}
      DEVELOPMENT_RESET_DELIVERY: ${DEVELOPMENT_RESET_DELIVERY:-true}
      DEVELOPMENT_INVITATION_DELIVERY: ${DEVELOPMENT_INVITATION_DELIVERY:-true}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5175,http://127.0.0.1:5175}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5175}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-kds-private}
      KDS_STORAGE_ROOT: ${KDS_STORAGE_ROOT:-/var/lib/kds-storage}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-log}
      NOTIFICATION_FROM_ADDRESS: ${NOTIFICATION_FROM_ADDRESS:-no-reply@kds.local}
      NOTIFICATION_DELIVERY_INTERVAL: ${NOTIFICATION_DELIVERY_INTERVAL:-PT1M}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
    volumes:
      - storage_data:${KDS_STORAGE_ROOT:-/var/lib/kds-storage}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5175}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
