name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        run: bash mvnw -B -ntp verify

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  deployment:
    name: Container and staging configuration
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ghcr.io/example/kds-club-manager/backend:test
      FRONTEND_IMAGE: ghcr.io/example/kds-club-manager/frontend:test
      DB_URL: jdbc:postgresql://database.example.test:5432/kds
      DB_USERNAME: kds_staging
      DB_PASSWORD: ci-only-database-password
      JWT_SECRET: ci-only-signing-secret-with-more-than-thirty-two-bytes
      FRONTEND_ORIGINS: https://staging.example.test
      FRONTEND_URL: https://staging.example.test
      SUPABASE_URL: https://storage.example.test
      SUPABASE_SERVICE_ROLE_KEY: ci-only-storage-key
      SUPABASE_STORAGE_BUCKET: kds-private
      NOTIFICATION_FROM_ADDRESS: no-reply@example.test
      SMTP_HOST: smtp.example.test
      SMTP_PORT: "587"
      SMTP_USERNAME: ci-only-smtp-user
      SMTP_PASSWORD: ci-only-smtp-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate staging Compose configuration
        run: docker compose -f docker-compose.staging.yml config --quiet

      - name: Build production images
        run: |
          docker build --build-arg APP_VERSION="$GITHUB_SHA" --build-arg VCS_REF="$GITHUB_SHA" --tag kds-backend:ci backend
          docker build --build-arg APP_VERSION="$GITHUB_SHA" --build-arg VCS_REF="$GITHUB_SHA" --tag kds-frontend:ci frontend

      - name: Verify images run without root
        run: |
          for image in kds-backend:ci kds-frontend:ci; do
            user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            test -n "$user"
            test "$user" != "root"
            test "$user" != "0"
          done

      - name: Verify frontend health and security headers
        run: |
          docker run --detach --name kds-frontend-ci --add-host backend:127.0.0.1 --publish 127.0.0.1:18080:8080 --read-only --tmpfs /tmp:rw,size=16m,mode=1777 --cap-drop ALL --security-opt no-new-privileges kds-frontend:ci
          trap 'docker rm --force kds-frontend-ci' EXIT
          curl --fail --show-error --silent --retry 12 --retry-delay 2 http://127.0.0.1:18080/healthz
          headers="$(curl --fail --show-error --silent --head http://127.0.0.1:18080/)"
          grep --ignore-case --quiet '^Content-Security-Policy:' <<< "$headers"
          grep --ignore-case --quiet '^X-Content-Type-Options: nosniff' <<< "$headers"
          grep --ignore-case --quiet '^X-Frame-Options: DENY' <<< "$headers"
          grep --ignore-case --quiet '^Referrer-Policy:' <<< "$headers"
          grep --ignore-case --quiet '^Permissions-Policy:' <<< "$headers"
